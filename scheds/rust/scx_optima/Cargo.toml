[package]
name = "scx_optima"
version = "1.0.0"
authors = ["Risheendra MN <rishindra.hackbox@gmail.com>"]
edition = "2024"
rust-version = "1.91"
description = "Algorithmic sched_ext scheduler with formal complexity guarantees (Greedy WSPT, Dynamic Programming, Branch & Bound) on heterogeneous cores."
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
crossbeam = "0.8"
libbpf-rs = "=0.27.2"
log = "0.4"
scx_stats = { path = "../../../rust/scx_stats", version = "1.1.3" }
scx_stats_derive = { path = "../../../rust/scx_stats/scx_stats_derive", version = "1.1.3" }
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.3" }
serde = { version = "1", features = ["derive"] }
simplelog = "0.12"

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.3" }

[features]
enable_backtrace = []
