# ==============================================================================
# Production High-Throughput NGINX API Gateway Configuration
# Tuned for Linux CPU Scheduler Benchmarks (sched_ext / CFS / EEVDF)
# ==============================================================================

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    # Basic Networking & I/O Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;

    default_type application/octet-stream;
    include /etc/nginx/mime.types;

    # Keepalive tuning to reduce connection establishment overhead
    keepalive_timeout 65s;
    keepalive_requests 100000;
    reset_timedout_connection on;
    client_body_timeout 15s;
    send_timeout 15s;

    # Buffer size optimizations
    client_body_buffer_size 128k;
    client_max_body_size 16m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Compression for JSON / Text APIs
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/plain
        text/css
        text/xml
        application/xml;

    # Detailed Latency Logging for Benchmark Tracing & Analysis
    log_format production_metrics
        'time=$time_iso8601 client=$remote_addr '
        'request="$request" status=$status bytes=$bytes_sent '
        'request_time=$request_time '
        'upstream_connect_time=$upstream_connect_time '
        'upstream_header_time=$upstream_header_time '
        'upstream_response_time=$upstream_response_time '
        'pipe=$pipe';

    access_log /var/log/nginx/access.log production_metrics buffer=64k flush=1s;
    error_log /var/log/nginx/error.log warn;

    # Upstream Connection Pool Definition
    upstream api_backend {
        server 127.0.0.1:8000;
        # Keepalive cache retains idle TCP connections to Uvicorn backend,
        # preventing socket churn, TIME_WAIT socket exhaustion, and 3-way handshakes
        keepalive 128;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    # DDoS & Concurrency Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=1000r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    server {
        listen 80 default_server reuseport;
        server_name _;

        # Fast path L4/L7 health probe (instant response from NGINX)
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","component":"nginx-gateway","timestamp":"$time_iso8601"}\n';
        }

        # NGINX internal stub status for socket/worker monitoring
        location = /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }

        # API Proxy Route - passes traffic to the Python Async Backend
        location / {
            # Concurrency and rate limiting protection
            limit_req zone=api_rate_limit burst=200 nodelay;
            limit_conn addr_conn_limit 200;

            # HTTP 1.1 Persistent Upstream Connection
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Upstream Buffer Optimization
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 32 16k;
            proxy_busy_buffers_size 64k;
            proxy_temp_file_write_size 64k;

            # Upstream Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            # Custom Performance Tracing Headers
            add_header X-Gateway-Engine "NGINX/1.22-Debian" always;
            add_header X-Gateway-Total-Time $request_time always;
            add_header X-Backend-Time $upstream_response_time always;
        }
    }
}
