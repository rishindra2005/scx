# ==============================================================================
# Production High-Throughput Redis 7 Configuration
# Optimized for Pipelining, Low-Latency Eviction, and Sched_ext CPU Benchmarks
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Network & Socket Tuning
# ------------------------------------------------------------------------------
bind 0.0.0.0
protected-mode no
port 6379

# TCP listen backlog: matches OS SOMAXCONN to prevent dropped SYN packets during bursts
tcp-backlog 65535

# Keep persistent connections open indefinitely (0 = disabled timeout)
timeout 0

# Detect dead peer sockets every 300 seconds
tcp-keepalive 300

# ------------------------------------------------------------------------------
# 2. Concurrency & Threaded I/O
# ------------------------------------------------------------------------------
# Offload network socket read/write processing from main thread.
# Redis core command execution remains strictly single-threaded and lock-free,
# while 4 I/O threads handle protocol parsing and response serialization.
io-threads 4
io-threads-do-reads yes

# ------------------------------------------------------------------------------
# 3. Memory Policy & Eviction Architecture
# ------------------------------------------------------------------------------
# Memory ceiling: sets hard memory limit for cache tier
maxmemory 2gb

# Evict least recently used keys when memory limit is reached
maxmemory-policy allkeys-lru

# Number of sample keys inspected to approximate true LRU (higher = better precision)
maxmemory-samples 10

# Eviction & deletion offloading to background bio threads (prevents main thread stalling)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Active defragmentation: dynamically compacts memory allocations in the background
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 30
active-defrag-cycle-min 5
active-defrag-cycle-max 50

# ------------------------------------------------------------------------------
# 4. Persistence & Durability (Production Tier)
# ------------------------------------------------------------------------------
dir /data

# Point-in-time RDB snapshots
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# Append Only File (AOF) durability
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# Fsync every second: optimal production balance between durability and throughput
appendfsync everysec

# Prevent fsync disk contention during background AOF rewrite or RDB snapshotting
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ------------------------------------------------------------------------------
# 5. High-Throughput Pipelining & Buffer Management
# ------------------------------------------------------------------------------
# Unlimited output buffer for normal pipelined clients (avoids disconnection under burst writes)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Background tick frequency (default is 10; increased to 100 for tighter expiry timing)
hz 100
dynamic-hz yes

# ------------------------------------------------------------------------------
# 6. Latency Monitoring & Introspection
# ------------------------------------------------------------------------------
# Latency spike threshold in milliseconds (tracks any operation taking > 5ms)
latency-monitor-threshold 5
slowlog-log-slower-than 10000
slowlog-max-len 1024
